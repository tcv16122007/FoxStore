<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin nhắn - Fox Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="header"></div>
    <div class="container">
        <div
            style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px">
            <h1 class="section-title" style="margin-bottom:0">💬 Tin nhắn</h1>
            <div id="adminTools"></div>
        </div>

        <div class="chat-layout">
            <aside class="chat-sidebar">
                <input type="text" id="contactSearch" class="form-control" placeholder="🔍 Tìm người liên hệ..."
                    oninput="renderContacts()" style="margin-bottom:12px">
                <div id="contactList"></div>
            </aside>

            <main class="chat-main" id="chatMain">
                <div class="chat-empty">
                    <div style="font-size:56px;margin-bottom:12px">💬</div>
                    <p>Chọn một người để bắt đầu trò chuyện</p>
                </div>
            </main>
        </div>
    </div>
    <div id="footer"></div>

    <!-- MODAL EXPORT CHAT -->
    <div class="modal-overlay" id="chatExportOverlay">
        <div class="modal" style="max-width:900px">
            <h3>📋 Xuất code chat <button class="modal-close" onclick="closeChatExport()">x</button></h3>
            <div class="export-hint"
                style="background:rgba(0,168,255,.08);border-left:3px solid #00a8ff;padding:12px 16px;border-radius:8px;font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.7">
                <b style="color:#00a8ff">Hướng dẫn:</b> 1. Bấm <b>📋 Copy</b> → 2. Mở <code>js/data.js</code> → 3. Thay
                <code>DEFAULT_MESSAGES</code> → 4. Paste → 5. Ctrl+S
            </div>
            <textarea id="chatExportCode" readonly spellcheck="false"
                style="width:100%;min-height:400px;padding:16px;background:#0d0d0d;border:1px solid var(--border);border-radius:10px;color:#00ff88;font-family:'SF Mono',Consolas,monospace;font-size:12px;line-height:1.6;outline:none;resize:vertical;white-space:pre;overflow-x:auto"></textarea>
            <div class="modal-actions" style="margin-top:20px">
                <button class="btn btn-outline" onclick="closeChatExport()">Đóng</button>
                <button class="btn" style="background:linear-gradient(135deg,#00a8ff,#0090e0);color:#000"
                    onclick="copyChatExport()">📋 Copy toàn bộ</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="shipperReviewOverlay">
        <div class="modal" style="max-width:640px">
            <div id="shipperReviewContent"></div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/reviews.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/slider.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/geo.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/main.js"></script>
    <script src="js/compare.js"></script>
    <script src="js/layout.js"></script>
    <script>
        let selectedEmail = null;
        const me = getCurrentUser();

        function renderContacts() {
            const box = document.getElementById("contactList");
            if (!box || !me) return;
            const kw = (document.getElementById("contactSearch")?.value || "").toLowerCase().trim();
            let contacts = getContactsFor(me.email);
            if (kw) contacts = contacts.filter(c =>
                c.name.toLowerCase().includes(kw) || c.email.toLowerCase().includes(kw)
            );

            if (!contacts.length) {
                box.innerHTML = `<p style="padding:20px;color:var(--muted);text-align:center;font-size:14px">Chưa có liên hệ nào.</p>`;
                return;
            }

            box.innerHTML = contacts.map(c => {
                const isOwner = c.role === "admin";
                const isShipper = c.shipperStatus === "approved";
                const unread = getUnreadCountFrom(me.email, c.email);
                const last = getLastMessage(me.email, c.email);
                const active = selectedEmail === c.email ? "active" : "";

                let icon = "👤";
                let badge = "";
                if (isOwner) { icon = "👑"; badge = `<span style="font-size:10px;color:var(--accent);font-weight:700">OWNER</span>`; }
                else if (isShipper) { icon = "🚚"; badge = `<span style="font-size:10px;color:#00a8ff;font-weight:700">SHIPPER</span>`; }
                else { badge = `<span style="font-size:10px;color:var(--muted)">USER</span>`; }

                return `
      <div class="contact-item ${active}" onclick="openChat('${c.email}')">
        <div class="contact-avatar ${isOwner ? 'owner' : isShipper ? 'shipper' : ''}">${icon}</div>
        <div class="contact-info">
          <div class="contact-name">${c.name} ${badge}</div>
          <div class="contact-preview">
            ${last ? `${last.from === me.email ? "Bạn: " : ""}${last.text.slice(0, 40)}${last.text.length > 40 ? "..." : ""}` : "Chưa có tin nhắn"}
          </div>
        </div>
        ${unread ? `<span class="contact-badge">${unread}</span>` : ""}
      </div>`;
            }).join("");
        }

        function openChat(email) {
            selectedEmail = email;
            markRoomRead(me.email, email);
            renderContacts();
            renderChatWindow();
            updateMsgBadge();
            setTimeout(() => {
                const list = document.getElementById("chatMessages");
                if (list) list.scrollTop = list.scrollHeight;
            }, 50);
        }

        function renderChatWindow() {
            const main = document.getElementById("chatMain");
            if (!selectedEmail) return;
            const other = getUsers().find(u => u.email === selectedEmail);
            if (!other) return;

            const msgs = getRoomMessages(me.email, selectedEmail);
            const isOwner = other.role === "admin";
            const isShipper = other.shipperStatus === "approved";

            const reviewBtn = isShipper
                ? `<button class="chat-review-btn" onclick="openShipperReviewModal('${other.email}')">⭐ Đánh giá shipper</button>`
                : "";

            main.innerHTML = `
    <div class="chat-header">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="contact-avatar ${isOwner ? 'owner' : isShipper ? 'shipper' : ''}" style="width:44px;height:44px;font-size:20px">
          ${isOwner ? "👑" : isShipper ? "🚚" : "👤"}
        </div>
        <div>
          <div style="font-weight:700">${other.name}</div>
          <div style="font-size:12px;color:var(--muted)">
            ${isOwner ? "Owner / Admin" : isShipper ? "Shipper" : "User"} • ${other.phone || ""}
          </div>
        </div>
      </div>
      ${reviewBtn}
    </div>

    <div class="chat-messages" id="chatMessages">
      ${msgs.length ? msgs.map(m => {
                const mine = m.from === me.email;
                return `
          <div class="chat-bubble-wrap ${mine ? 'mine' : 'theirs'}">
            <div class="chat-bubble ${mine ? 'mine' : 'theirs'}">
              ${escapeHtml(m.text)}
              <div class="chat-time">${formatTime(m.timestamp)}</div>
            </div>
          </div>`;
            }).join("") : `
        <div style="text-align:center;color:var(--muted);padding:60px 20px;font-size:14px">
          Chưa có tin nhắn. Hãy gửi lời chào đầu tiên! 👋
        </div>`}
    </div>

    <form class="chat-input-wrap" onsubmit="handleSend(event)">
      <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." autocomplete="off">
      <button type="submit" class="btn">Gửi ➤</button>
    </form>
  `;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }
        function formatTime(ts) {
            const d = new Date(ts);
            return d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) + " • " +
                d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit" });
        }

        function handleSend(e) {
            e.preventDefault();
            const input = document.getElementById("chatInput");
            const text = input.value.trim();
            if (!text || !selectedEmail) return;
            sendMessage(me.email, selectedEmail, text);
            input.value = "";
            renderChatWindow();
            renderContacts();
            updateMsgBadge();
            setTimeout(() => {
                const list = document.getElementById("chatMessages");
                if (list) list.scrollTop = list.scrollHeight;
            }, 50);
        }

        function openShipperReviewModal(shipperEmail) {
            const shipper = getUsers().find(u => u.email === shipperEmail);
            if (!shipper) return;

            const allReviews = getShipperReviews().filter(r => r.shipperEmail === shipperEmail);
            const avg = getShipperAvgStars(shipperEmail);
            const total = allReviews.length;

            const orders = JSON.parse(localStorage.getItem("fox_orders")) || [];
            const reviewableOrder = orders.find(o =>
                o.userEmail === me.email &&
                o.shipperEmail === shipperEmail &&
                o.status === "delivered" &&
                !getShipperReviewByOrder(o.id)
            );
            const hasDelivered = orders.some(o =>
                o.userEmail === me.email &&
                o.shipperEmail === shipperEmail &&
                o.status === "delivered"
            );

            let html = `
    <h3 style="margin-bottom:20px">
      ⭐ Đánh giá shipper
      <button class="modal-close" onclick="closeShipperReviewModal()">×</button>
    </h3>

    <div class="shipper-review-info">
      <div class="shipper-avatar">🚚</div>
      <div style="flex:1">
        <h4>${shipper.name}</h4>
        <p>${shipper.email} • ${shipper.phone}</p>
        <div style="margin-top:8px">
          ${total
                    ? `${starsDisplay(avg, 20)} <b style="color:#ffb020;font-size:18px;margin-left:6px">${avg.toFixed(1)}</b> <span style="color:var(--muted);font-size:13px">(${total} đánh giá)</span>`
                    : `<span style="color:var(--muted);font-size:13px">Chưa có đánh giá nào</span>`}
        </div>
      </div>
    </div>
  `;

            if (!isShipper() && !isAdmin()) {
                if (reviewableOrder) {
                    html += `
        <div class="review-form-box">
          <h4>✍️ Đánh giá của bạn</h4>
          <p style="color:var(--muted);font-size:13px;margin-bottom:12px">
            Đơn #${reviewableOrder.id} – Giao lúc ${formatDate(reviewableOrder.updatedAt)}
          </p>
          ${starPickerHTML("shipperChatStars", 0)}
          <textarea class="form-control" id="shipperChatComment" rows="3"
                    placeholder="Nhận xét về shipper (không bắt buộc)..."
                    style="margin-top:12px;font-size:13px"></textarea>
          <button class="btn" style="width:100%;margin-top:12px;background:linear-gradient(135deg,#ffb020,#ff8533);color:#000"
                  onclick="submitShipperReviewFromChat('${reviewableOrder.id}', '${shipperEmail}')">
            📤 Gửi đánh giá
          </button>
        </div>
      `;
                } else if (hasDelivered) {
                    html += `
        <div class="review-form-box" style="text-align:center;background:rgba(22,199,132,.08);border-color:var(--success)">
          <p style="color:var(--success);font-size:14px">✅ Bạn đã đánh giá shipper này rồi</p>
        </div>
      `;
                } else {
                    html += `
        <div class="review-form-box" style="text-align:center">
          <p style="color:var(--muted);font-size:13px">
            💡 Bạn chỉ có thể đánh giá shipper sau khi đơn hàng đã được giao thành công.
          </p>
        </div>
      `;
                }
            }

            if (total) {
                html += `
      <div style="margin-top:8px">
        <h4 style="margin-bottom:12px;font-size:14px">📝 Tất cả đánh giá (${total})</h4>
        <div class="review-list" style="max-height:320px;overflow-y:auto;padding-right:4px">
          ${allReviews.sort((a, b) => b.createdAt - a.createdAt).slice(0, 20).map(r => `
            <div class="review-item">
              <div class="review-avatar">${(r.userName || "U").charAt(0).toUpperCase()}</div>
              <div class="review-body">
                <div class="review-head">
                  <div>
                    <b>${r.userName}</b>
                    <span class="review-time">${formatDate(r.createdAt)}</span>
                  </div>
                  ${starsDisplay(r.stars, 14)}
                </div>
                ${r.comment ? `<div class="review-text">"${r.comment}"</div>` : ""}
              </div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
            }

            document.getElementById("shipperReviewContent").innerHTML = html;
            document.getElementById("shipperReviewOverlay").classList.add("show");
        }

        function closeShipperReviewModal() {
            document.getElementById("shipperReviewOverlay").classList.remove("show");
        }

        function submitShipperReviewFromChat(orderId, shipperEmail) {
            const stars = getStarValue("shipperChatStars");
            if (!stars) return showToast("❌ Vui lòng chọn số sao!");
            const comment = document.getElementById("shipperChatComment").value;
            addShipperReview(orderId, shipperEmail, me.email, me.name, stars, comment);
            showToast("✅ Đã gửi đánh giá shipper!");
            closeShipperReviewModal();
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (!requireUser(true)) return;

            if (isAdmin()) injectAdminLayout();
            else if (isShipper()) injectShipperLayout();
            else injectLayout("");

            if (isAdmin()) {
                document.getElementById("adminTools").innerHTML = `
      <button class="btn" style="background:linear-gradient(135deg,#00a8ff,#0090e0);color:#000" onclick="exportChatJS()">
        📋 Xuất code chat
      </button>`;
            }

            renderContacts();

            const params = new URLSearchParams(location.search);
            const autoOpen = params.get("contact");
            if (autoOpen && autoOpen !== me.email) {
                const exists = getUsers().find(u => u.email === autoOpen);
                if (exists) openChat(autoOpen);
            }

            setInterval(() => {
                if (selectedEmail) {
                    const msgs = getRoomMessages(me.email, selectedEmail);
                    const oldCount = document.querySelectorAll(".chat-bubble-wrap").length;
                    if (msgs.length !== oldCount) {
                        const draft = document.getElementById("chatInput")?.value || "";
                        renderChatWindow();
                        if (document.getElementById("chatInput")) document.getElementById("chatInput").value = draft;
                        const list = document.getElementById("chatMessages");
                        if (list) list.scrollTop = list.scrollHeight;
                    }
                }
                renderContacts();
                updateMsgBadge();
                updateNotifBadge();
            }, 3000);
        });

        document.addEventListener("click", e => {
            if (e.target.id === "chatExportOverlay") closeChatExport();
            if (e.target.id === "shipperReviewOverlay") closeShipperReviewModal();
        });
    </script>
</body>

</html>
