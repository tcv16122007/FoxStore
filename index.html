<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Store 🦊 - Phụ kiện PC / Laptop chính hãng</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="header"></div>
    <div class="container">
        <div class="slider" id="slider"></div>
        <div class="countdown-bar">
            <div class="countdown-label">⚡ FLASH SALE HÔM NAY<small>Giảm đến 40% - kết thúc sau</small></div>
            <div class="countdown" id="countdown"></div>
            <a href="category.html?group=sale" class="btn">Mua ngay</a>
        </div>

        <div class="section-head">
            <h2 class="section-title">Sản phẩm mới</h2>
            <a href="category.html?group=new" class="see-more">Xem tất cả →</a>
        </div>
        <div class="product-grid" id="gridNew"></div>

        <div class="section-head">
            <h2 class="section-title">🔥 Sản phẩm hot</h2>
            <a href="category.html?group=hot" class="see-more">Xem tất cả →</a>
        </div>
        <div class="product-grid" id="gridHot"></div>

        <div class="section-head">
            <h2 class="section-title">💥 Sản phẩm khuyến mãi</h2>
            <a href="category.html?group=sale" class="see-more">Xem tất cả →</a>
        </div>
        <div class="product-grid" id="gridSale"></div>

        <div id="viewedSection" style="display:none">
            <div class="section-head">
                <h2 class="section-title">👀 Bạn đã xem gần đây</h2>
            </div>
            <div class="product-grid" id="gridViewed"></div>
        </div>

        <div id="outSection" style="display:none">
            <div class="section-head">
                <h2 class="section-title">🚫 Sản phẩm đã hết hàng</h2>
                <a href="category.html?group=out" class="see-more">Xem tất cả →</a>
            </div>
            <div class="product-grid" id="gridOut"></div>
        </div>
    </div>
    <div id="footer"></div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/reviews.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/slider.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/geo.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/main.js"></script>
    <script src="js/compare.js"></script>
    <script src="js/layout.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            injectLayout("home");
            renderSlider();
            startCountdown();
            renderHomeGroups();
        });
    </script>
</body>

</html>
